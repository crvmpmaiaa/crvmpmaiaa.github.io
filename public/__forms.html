<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Netlify reads this at deploy time to register the form. The real form is in src/footer/Footer.tsx and posts here. -->
    <form name="quote" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
  </body>
</html>
