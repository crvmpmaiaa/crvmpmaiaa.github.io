<!doctype html><html><body style="margin:0;background:#000"><canvas id=c style="width:100vw;height:100vh;display:block"></canvas><script>
const c=document.getElementById('c');const gl=c.getContext('webgl2');c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height);
const vs=`#version 300 es
precision highp float;layout(location=0) in vec2 a;out vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
const fs=`#version 300 es
precision highp float;out vec4 fragColor;uniform vec3 iResolution;uniform float iTime;
void mainImage(out vec4 fragColor, in vec2 fragCoord){vec2 r=iResolution.xy;float t=iTime;vec3 FC=vec3(fragCoord,t);vec4 o=vec4(0.0);vec3 p=vec3(0.0),v;
for(float i=0.0,z=0.0,d=0.0;i++<40.0;){o+=(cos(i*0.2+t+vec4(0.0,1.0,3.0,0.0))+1.0)/max(d,1e-4);p=z*normalize(FC.rgb*2.0-r.xyy);v=normalize(cos(t*0.25+vec3(0.0,1.0,4.0)));p=dot(v,p)*v+cross(v,p);p.z-=t;vec3 q=abs(fract(p)-0.5);p=q+q.yzx-sin(z*0.7);d=0.3*length(min(p,p.yzx));z+=d;}
o=tanh(o/2000.0);fragColor=vec4(o.rgb,1.0);}
void main(){mainImage(fragColor,gl_FragCoord.xy);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(p,'iResolution'),uT=gl.getUniformLocation(p,'iTime');const t0=performance.now();
(function f(){gl.uniform3f(uR,c.width,c.height,1);gl.uniform1f(uT,(performance.now()-t0)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(f);})();
</script></body></html>
